name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Check the release tag against the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(npm pkg get version | tr -d '"')
          [ "$TAG" = "v$version" ] || {
            echo "release tag $TAG does not match package.json $version"
            exit 1
          }
      - run: bun run test
      - run: npm publish
